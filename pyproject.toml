[project]
name = "software-e2e-backend"
version = "0.1.0"
description = "Another FastAPI boilerplate."
readme = "README.md"
requires-python = ">=3.15.2"
dependencies = [
    "fastapi>=0.165.0,<0.166.0",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2.1.9",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pre-commit>=4.7.0",
    "pre-commit-uv>=4.4.3",
    "ruff>=0.17.6",
]
